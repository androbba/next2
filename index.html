<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>სპოილერები</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@700;800&family=Noto+Sans+Georgian:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efe9f8; --paper:#fffafc; --ink:#1d1a3a; --soft:#625d8a; --bar:#1d1a3a; --line:#e2d6ee; --accent:#ff4f86; --hole:#efe9f8;
  --display:"Noto Serif Georgian",Georgia,serif; --body:"Noto Sans Georgian",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0d28;--paper:#1b1847;--ink:#f8edf3;--soft:#b9b3dc;--bar:#060516;--line:#37327a;--accent:#ff6b9a;--hole:#0f0d28;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0d28;--paper:#1b1847;--ink:#f8edf3;--soft:#b9b3dc;--bar:#060516;--line:#37327a;--accent:#ff6b9a;--hole:#0f0d28;color-scheme:dark}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{min-height:100%;touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px;
  display:flex;justify-content:center;overflow-x:hidden}
main{width:100%;max-width:560px;min-width:0}
.sheet{position:relative;background:var(--paper);border-radius:6px;padding:38px 42px 40px;box-shadow:0 24px 60px rgba(29,26,58,.18);min-width:0}
.sheet:before,.sheet:after{content:"";position:absolute;top:0;bottom:0;width:18px;
  background:repeating-linear-gradient(var(--hole) 0 12px,transparent 12px 26px) center/8px 100% no-repeat}
.sheet:before{left:6px}.sheet:after{right:6px}
.stamp{display:inline-block;font:600 13px var(--body);letter-spacing:.14em;color:var(--accent);border:2px solid var(--accent);border-radius:4px;padding:2px 12px;transform:rotate(-3deg);margin-bottom:18px}
h1{font:800 clamp(27px,7vw,38px)/1.25 var(--display);text-wrap:balance;margin-bottom:14px}
.lead{color:var(--soft);margin-bottom:28px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:34px}
.lock{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;min-height:84px;border:0;border-radius:6px;background:var(--bar);color:var(--paper);cursor:pointer;padding:12px;font:600 15px var(--body);overflow:hidden}
.lock:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 9px,rgba(255,255,255,.06) 9px 10px)}
.lock svg{width:20px;height:20px;position:relative;flex:none}
.lock span{position:relative;opacity:0;transition:opacity .2s}
.lock.no span{opacity:1}
.lock.no{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.lock:focus-visible,.peel:focus-visible,.again:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.hint{font-size:15px;margin-bottom:12px;color:var(--soft)}
.reveal{position:relative;border-radius:6px;min-height:92px}
.reveal + .reveal{margin-top:16px}
.reveal.enter{animation:enter .6s ease both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}}
.reveal .text{display:flex;align-items:center;min-height:92px;padding:16px 20px;border-radius:6px;background:var(--paper);border:2px solid var(--accent);font:700 clamp(19px,5vw,23px)/1.4 var(--display);text-wrap:balance}
.peel{position:absolute;inset:0;border:0;border-radius:6px;background:var(--bar);color:var(--paper);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;font:600 15px var(--body);overflow:hidden;
  transition:transform .8s cubic-bezier(.5,0,.8,.4),opacity .8s;transform-origin:0 0}
.peel:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 9px,rgba(255,255,255,.06) 9px 10px)}
.peel svg,.peel b{position:relative}
.peel svg{width:20px;height:20px;animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(5px)}}
.reveal.open .peel{transform:translate(18%,130%) rotate(9deg);opacity:0;pointer-events:none}
.reveal.open .text{animation:glow 1.4s ease-out}
@keyframes glow{from{box-shadow:0 0 0 0 var(--accent)}to{box-shadow:0 0 0 18px transparent}}
.again-wrap{margin-top:34px;padding-top:26px;border-top:2px dashed var(--line);text-align:center}
.again{display:inline-flex;align-items:center;justify-content:center;max-width:100%;min-height:52px;padding:12px 26px;border:2px solid var(--accent);border-radius:99px;background:transparent;color:var(--accent);font:600 16px var(--body);text-decoration:none;text-wrap:balance;transition:background .2s,color .2s,transform .15s}
.again:hover{background:var(--accent);color:var(--paper);transform:translateY(-2px)}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.hearts i{position:absolute;bottom:-30px;font-style:normal;font-size:24px;animation:rise 3.2s ease-in forwards}
@keyframes rise{to{transform:translateY(-110vh) rotate(20deg);opacity:0}}
@media (max-width:420px){.sheet{padding:30px 30px 32px}.pair{gap:10px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
</style>

<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "z11dzjkmz7");
</script>

    <script data-goatcounter="https://androbba.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

  <meta name="robots" content="noindex, nofollow">
    
</head>
<body>

<main>
<div class="sheet">
  <span class="stamp">SPOILER</span>
  <h1>სპოილერებისთვის მოხვედი? 😏</h1>
  <p class="lead">ასე მარტივად ვერ გაიგებ, რა ხდებოდა ორივე ღილაკის უკან :D</p>

  <div class="pair">
    <button class="lock" type="button" aria-label="დაფარულია" data-evt="locked-button-1-clicked">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>:D</span>
    </button>
    <button class="lock" type="button" aria-label="დაფარულია" data-evt="locked-button-2-clicked">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>:D</span>
    </button>
  </div>

  <p class="hint">თუმცა ერთი სპოილერი შეიძლება...</p>

  <div class="reveal" id="rv1">
    <div class="text">ერთ-ერთი ღილაკი ცოტა მეტ გამბედაობას მოითხოვდა 😉</div>
    <button class="peel" type="button" aria-label="სპოილერის გახსნა">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg><b>სპოილერი</b>
    </button>
  </div>

  <div class="reveal" id="rv2" hidden>
    <!-- ტექსტი 2: აქ ჩაწერე შენი ფრაზა -->
    <div class="text">კარტინგში გამარჯვებული ისევ მე ვარ 🏎️😂</div>
    <button class="peel" type="button" aria-label="სპოილერი 2-ის გახსნა">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg><b>სპოილერი 2</b>
    </button>
  </div>

  <div class="again-wrap">
    <!-- ORIGINAL_URL: ჩაწერე აქ შენი ლინკი href-ში -->
    <a class="again" id="again" href="http://androbba.github.io/next3">ორიგინალი სცენარის თავიდან ნახვა 🎬</a>
  </div>
</div>
</main>
<div class="hearts" id="hearts" aria-hidden="true"></div>

<script>
(function(){
  function gc(n){try{if(window.goatcounter&&window.goatcounter.count)window.goatcounter.count({path:n,title:n,event:true});}catch(e){}}
  var H=document.getElementById('hearts');
  function hearts(){
    for(var k=0;k<14;k++)(function(k){setTimeout(function(){
      var s=document.createElement('i');s.textContent=['❤️','💖','✨'][k%3];s.style.left=(Math.random()*92+2)+'vw';
      H.appendChild(s);setTimeout(function(){s.remove();},3300);
    },k*110);})(k);
  }
  Array.prototype.forEach.call(document.querySelectorAll('.lock'),function(b){
    b.addEventListener('click',function(){
      gc(b.getAttribute('data-evt'));
      b.classList.remove('no');void b.offsetWidth;b.classList.add('no');
    });
  });
  function setup(id,evt,after){
    var rv=document.getElementById(id),pb=rv.querySelector('.peel'),done=false;
    pb.addEventListener('click',function(){
      if(done)return;done=true;
      rv.classList.add('open');pb.setAttribute('aria-hidden','true');pb.tabIndex=-1;
      gc(evt);hearts();
      if(after)after();
    });
  }
  setup('rv1','spoiler-1-revealed',function(){
    setTimeout(function(){
      var r2=document.getElementById('rv2');
      r2.hidden=false;r2.classList.add('enter');
      r2.scrollIntoView({behavior:'smooth',block:'center'});
    },1000);
  });
  setup('rv2','spoiler-2-revealed');

  var again=document.getElementById('again');
  again.addEventListener('click',function(e){
    e.preventDefault();
    gc('original-script-clicked');
    var url=again.href;
    setTimeout(function(){window.location.href=url;},250);
  });
})();
</script>
</body>
</html>
